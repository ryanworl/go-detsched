name: Bug report
description: detsched, its SDK, or a release archive does something wrong.
body:
  - type: input
    id: version
    attributes:
      label: Version and platform
      description: The output of `go version`.
      placeholder: go version go1.27.4-detsched24 linux/amd64
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What did you run?
      description: The `detsched` command line, or the replay line from its output, and the package or a small program that shows the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: got
    attributes:
      label: What happened?
      description: The output, and the failing run's log if detsched kept one. Say whether the replay line repeats the failure.
      render: text
    validations:
      required: true
  - type: textarea
    id: want
    attributes:
      label: What did you expect?
    validations:
      required: true
