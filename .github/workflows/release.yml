name: Release

# misc/release/publish.bash -tag pushes a tag named by VERSION, such as
# go1.27.4-detsched1, with the SDK's tag misc/detsched/v0.1.0. This
# workflow builds the archives, tests each one on its platform, and
# publishes them as the tag's GitHub release.

on:
  push:
    tags: ["go*-detsched*"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      matrix:
        target: [linux-amd64, linux-arm64, darwin-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache: false
      - name: Check that the tag is VERSION
        run: |
          v=$(sed -n 1p VERSION)
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME is not VERSION's $v"
            exit 1
          fi
      - name: Build the archive
        env:
          TARGET: ${{ matrix.target }}
        run: GOROOT_BOOTSTRAP="$(go env GOROOT)" GOOS="${TARGET%-*}" GOARCH="${TARGET#*-}" misc/release/build.bash -distpack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: pkg/distpack/${{ github.ref_name }}.${{ matrix.target }}.tar.gz*
          if-no-files-found: error

  smoke:
    name: smoke (${{ matrix.target }}, ${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-amd64, os: ubuntu-24.04}
          - {target: linux-arm64, os: ubuntu-24.04-arm}
          - {target: darwin-arm64, os: macos-14}
          - {target: darwin-arm64, os: macos-15}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.target }}
          path: dist
      - name: Smoke test
        env:
          TARGET: ${{ matrix.target }}
        run: misc/release/smoke.bash "dist/$GITHUB_REF_NAME.$TARGET.tar.gz"

  release:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          cat ./*.sha256 >SHA256SUMS
          v=$GITHUB_REF_NAME
          n=${v##*-detsched}
          url=https://github.com/$GITHUB_REPOSITORY/releases/download/$v
          cat >notes.md <<EOF
          Go ${v%%-detsched*} with \`GOEXPERIMENT=detsched\` and the \`detsched\` command, for Linux (amd64, arm64) and macOS (arm64).

          Install (use \`darwin-arm64\` or \`linux-arm64\` for those platforms):

          \`\`\`
          mkdir -p ~/sdk
          curl -fsSL $url/$v.linux-amd64.tar.gz | tar -C ~/sdk -xz
          export PATH=\$HOME/sdk/$v/bin:\$PATH
          \`\`\`

          The macOS binaries are not notarized: download them with curl as above, or run \`xattr -d com.apple.quarantine\` on an archive a browser downloaded before unpacking it.

          The SDK for this release:

          \`\`\`
          go get github.com/$GITHUB_REPOSITORY/misc/detsched@v0.$n.0
          \`\`\`

          SHA-256 checksums are in SHA256SUMS.
          EOF
          gh release create "$v" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$v" --notes-file notes.md ./*.tar.gz SHA256SUMS
